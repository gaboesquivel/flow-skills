# Flow governance: squash merges use the PR title as the commit subject, so it must be a Conventional Commit.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

# Title edits and pushes in quick succession cancel the superseded check.
concurrency:
  # Draft runs skip in their own group so a late one never cancels the ready run.
  group: pr-title-${{ github.event.pull_request.number }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  pr-title:
    # Drafts run nothing; ready_for_review and later pushes run it (spec 048).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^[a-z]+(\([^()]+\))?!?: [^[:space:]]'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title must be a Conventional Commit, type(scope): summary. Got: $TITLE"
            exit 1
          fi

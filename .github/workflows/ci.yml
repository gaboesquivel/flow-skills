name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx --yes skills@latest --version
      - run: pnpm validate
      - run: pnpm test

  alignment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deterministic PR alignment
        env:
          FLOW_PR_BODY: ${{ github.event.pull_request.body }}
          FLOW_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          merge_base="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          node scripts/check-pr-alignment.mjs --base "$merge_base" --head "${{ github.sha }}"

  context-review:
    if: github.event_name == 'pull_request'
    needs: [validate, alignment]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: LLM context review
        env:
          FLOW_REVIEW_API_KEY: ${{ secrets.FLOW_REVIEW_API_KEY }}
          FLOW_REVIEW_API_BASE: ${{ secrets.FLOW_REVIEW_API_BASE }}
          FLOW_REVIEW_MODEL: ${{ secrets.FLOW_REVIEW_MODEL }}
          FLOW_PR_TITLE: ${{ github.event.pull_request.title }}
          FLOW_PR_BODY: ${{ github.event.pull_request.body }}
          FLOW_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          merge_base="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          node scripts/run-context-review.mjs --base "$merge_base" --head "${{ github.sha }}" --pr-number "${{ github.event.pull_request.number }}"

name: CI

on:
  push:
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to the same PR cancels its superseded run.
concurrency:
  # Draft runs skip in their own group so a late one never cancels the ready run.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # Drafts run nothing; ready_for_review and later pushes run it (spec 048).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # One cell on pull requests; release tags run the OS x Node matrix and the release tests.
    strategy:
      matrix:
        os: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        node: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && '[22, 24]' || '[22]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm validate
      - run: pnpm test
      - if: startsWith(github.ref, 'refs/tags/')
        run: pnpm test:release

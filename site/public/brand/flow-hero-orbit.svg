<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="420" viewBox="0 0 480 420" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">Flow: Intent, Build, Ship, Measure</title>
<desc id="hero-desc">Four connected product-engineering concerns orbit the approved Throughline mark. Intent finds the right problem; Build creates and iterates; Ship delivers to real users; Measure learns and adapts.</desc>
<defs>
  <linearGradient id="prism" x1="15" x2="377" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9ea6f8"/><stop offset=".55" stop-color="#c6a8f6"/><stop offset="1" stop-color="#f0a6cf"/></linearGradient>
  <linearGradient id="orbit-gradient" x1="83" y1="72" x2="392" y2="347" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c6a8f6"/><stop offset=".55" stop-color="#927ed7"/><stop offset="1" stop-color="#f0a6cf"/></linearGradient>
  <radialGradient id="core-glow"><stop offset="0" stop-color="#a78bfa" stop-opacity=".16"/><stop offset=".75" stop-color="#a78bfa" stop-opacity=".045"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.8"/></filter>
</defs>
<!-- Approved hero motif: translucent rings, connected stages, canonical Throughline logo. -->
